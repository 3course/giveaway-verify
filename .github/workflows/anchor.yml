name: Anchor log head

# Hourly: fetch the Giveaway Draw commitment-log head and commit it to anchors/.
# GitHub's history is the independent witness. An unreachable API is skipped quietly;
# a rewritten history fails the run and is recorded in anchors/ALERTS.jsonl.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and check the log head
        id: anchor
        env:
          SOURCE: ${{ vars.ANCHOR_SOURCE_URL }}
        run: node .github/scripts/anchor.mjs

      - name: Commit anchor
        if: always() && steps.anchor.outputs.changed == 'true'
        run: |
          git config user.name "giveaway-anchor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anchors
          if git diff --cached --quiet; then exit 0; fi
          if [ "${{ steps.anchor.outputs.alert }}" = "true" ]; then
            git commit -m "ALERT: commitment log inconsistency detected"
          else
            git commit -m "anchor: log head #${{ steps.anchor.outputs.seq }}"
          fi
          git push
